<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seedlings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <strong id="clock">…</strong>
      <span id="weather" class="quiet"></span>
      <span id="count" class="quiet"></span>
      <span class="budget">
        <span id="reason" class="quiet"></span>
        <span class="meter" aria-hidden="true"><span id="meter-fill"></span></span>
        <span id="left" class="quiet"></span>
      </span>
      <button id="event-open" class="event-open" type="button">Cause an event</button>
    </header>
    <dialog id="event-dialog" class="event-dialog" aria-labelledby="event-title">
      <form id="event-form">
        <h2 id="event-title">Cause an event</h2>
        <label>Event
          <select id="event-kind">
            <option value="weather">Change the weather</option>
            <option value="close">Close a building</option>
            <option value="reopen">Reopen a building</option>
            <option value="break">Break a building</option>
            <option value="stranger">A stranger arrives</option>
            <option value="facility">Place a facility</option>
          </select>
        </label>
        <div id="event-fields" class="event-fields"></div>
        <p id="event-answer" role="status"></p>
        <div class="event-buttons">
          <button id="event-close" type="button">Close</button>
          <button id="event-send" type="submit">Send</button>
        </div>
      </form>
    </dialog>
    <main class="layout">
      <section class="town" aria-label="The town">
        <canvas id="town"></canvas>
        <p id="status" class="status" role="status"></p>
      </section>
      <aside class="panel" aria-label="The town's people">
        <nav id="tabs" class="tabs" aria-label="Who to follow"></nav>
        <div id="person">
          <h1 id="name">Pip</h1>
          <h2>Right now</h2>
          <p id="doing"></p>
          <h2 id="mind-heading">On Pip's mind</h2>
          <p id="thought" class="thought"></p>
          <ul id="mind" class="mind"></ul>
          <h2 id="home-heading" hidden>Home</h2>
          <p id="home" hidden></p>
          <h2>Diary</h2>
          <p id="hint" class="quiet hint">Open an entry to see what Pip saw and thought.</p>
          <ol id="diary" class="diary"></ol>
        </div>
        <div id="townview" hidden>
          <h1>Town</h1>
          <p id="population" class="quiet"></p>
          <h2>The café</h2>
          <p id="cafe" class="quiet"></p>
          <ul id="misses" class="mind"></ul>
          <h2>Gallery</h2>
          <ol id="gallery" class="gallery"></ol>
          <h2>What has been happening</h2>
          <ol id="events" class="events"></ol>
        </div>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
